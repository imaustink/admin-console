name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpi:
    name: Build Raspberry Pi (Linux ARM64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation dependencies
        run: |
          sudo dpkg --add-architecture arm64
          # Restrict all existing sources to amd64 so apt doesn't try security.ubuntu.com for arm64
          sudo sed -i 's/^deb \[arch=/deb [arch=amd64,/g; s/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d -name '*.list' -exec \
            sed -i 's/^deb \[arch=/deb [arch=amd64,/g; s/^deb http/deb [arch=amd64] http/g' {} +
          # Add arm64-only sources from ports.ubuntu.com
          sudo bash -c 'cat > /etc/apt/sources.list.d/arm64.list << LIST
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          LIST'
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            pkg-config \
            libwebkit2gtk-4.1-dev:arm64 \
            libssl-dev:arm64 \
            libgtk-3-dev:arm64 \
            librsvg2-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (ARM64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: npm run tauri:build:rpi

      - name: Upload RPi artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpi-artifacts
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (macOS Universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  create-release:
    name: Create GitHub Release
    needs: [build-rpi, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download RPi artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpi-artifacts
          path: artifacts/rpi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          RPI_TARBALL=$(find artifacts/rpi -name "*.AppImage.tar.gz" | head -1)
          RPI_SIG=$(find artifacts/rpi -name "*.AppImage.tar.gz.sig" | head -1)
          RPI_FILENAME=$(basename "$RPI_TARBALL")
          RPI_SIGNATURE=$(cat "$RPI_SIG")

          MAC_TARBALL=$(find artifacts/macos -name "*.app.tar.gz" | head -1)
          MAC_SIG=$(find artifacts/macos -name "*.app.tar.gz.sig" | head -1)
          MAC_FILENAME=$(basename "$MAC_TARBALL")
          MAC_SIGNATURE=$(cat "$MAC_SIG")

          cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "See the release notes on GitHub.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-aarch64": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$RPI_FILENAME",
                "signature": "$RPI_SIGNATURE"
              },
              "darwin-x86_64": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$MAC_FILENAME",
                "signature": "$MAC_SIGNATURE"
              },
              "darwin-aarch64": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$MAC_FILENAME",
                "signature": "$MAC_SIGNATURE"
              }
            }
          }
          JSON

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            artifacts/rpi/*.AppImage.tar.gz \
            artifacts/rpi/*.AppImage.tar.gz.sig \
            artifacts/macos/*.app.tar.gz \
            artifacts/macos/*.app.tar.gz.sig \
            latest.json
