name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpi:
    name: Build Raspberry Pi (Linux ARM64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (required to run arm64 Docker image on amd64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside ARM64 Docker container (native, no cross-compilation)
        run: |
          docker build --platform linux/arm64 -t homelab-dashboard-builder -f Dockerfile.rpi .
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}":/build \
            -e TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" \
            -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" \
            -e CARGO_TARGET_DIR=/build/src-tauri/target-linux \
            homelab-dashboard-builder \
            bash -c "cd /build && npm ci && npm run tauri:build"

      - name: Upload RPi artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpi-artifacts
          path: |
            src-tauri/target-linux/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target-linux/release/bundle/appimage/*.AppImage.tar.gz.sig

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (macOS Universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  create-release:
    name: Create GitHub Release
    needs: [build-rpi, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download RPi artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpi-artifacts
          path: artifacts/rpi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          RPI_TARBALL=$(find artifacts/rpi -name "*.AppImage.tar.gz" | head -1)
          RPI_SIG=$(find artifacts/rpi -name "*.AppImage.tar.gz.sig" | head -1)
          RPI_FILENAME=$(basename "$RPI_TARBALL")
          RPI_SIGNATURE=$(cat "$RPI_SIG")

          MAC_TARBALL=$(find artifacts/macos -name "*.app.tar.gz" | head -1)
          MAC_SIG=$(find artifacts/macos -name "*.app.tar.gz.sig" | head -1)
          MAC_FILENAME=$(basename "$MAC_TARBALL")
          MAC_SIGNATURE=$(cat "$MAC_SIG")

          cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "See the release notes on GitHub.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-aarch64": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$RPI_FILENAME",
                "signature": "$RPI_SIGNATURE"
              },
              "darwin-x86_64": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$MAC_FILENAME",
                "signature": "$MAC_SIGNATURE"
              },
              "darwin-aarch64": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$MAC_FILENAME",
                "signature": "$MAC_SIGNATURE"
              }
            }
          }
          JSON

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            artifacts/rpi/*.AppImage.tar.gz \
            artifacts/rpi/*.AppImage.tar.gz.sig \
            artifacts/macos/*.app.tar.gz \
            artifacts/macos/*.app.tar.gz.sig \
            latest.json
