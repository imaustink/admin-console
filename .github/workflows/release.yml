name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpi:
    name: Build Raspberry Pi (Linux ARM64)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (required to run arm64 Docker image on amd64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside ARM64 Docker container (native, no cross-compilation)
        run: |
          docker build --platform linux/arm64 -t homelab-dashboard-builder -f Dockerfile.rpi .
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}":/build \
            -e TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" \
            -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" \
            -e CARGO_TARGET_DIR=/build/src-tauri/target-linux \
            homelab-dashboard-builder \
            bash -c "cd /build && npm ci && npm run tauri:build"

      - name: Upload RPi artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpi-artifacts
          path: |
            src-tauri/target-linux/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target-linux/release/bundle/appimage/*.AppImage.tar.gz.sig

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (macOS Universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          if-no-files-found: warn
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  create-release:
    name: Create GitHub Release
    needs: [build-rpi, build-macos]
    if: ${{ always() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download RPi artifacts
        if: ${{ needs.build-rpi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rpi-artifacts
          path: artifacts/rpi

      - name: Download macOS artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, json
          from pathlib import Path
          from datetime import datetime, timezone

          version = os.environ['VERSION']
          repo = os.environ['REPO']
          platforms = {}

          rpi = sorted(Path('artifacts/rpi').glob('*.AppImage.tar.gz')) if Path('artifacts/rpi').exists() else []
          if rpi:
              sig = Path(str(rpi[0]) + '.sig')
              if sig.exists():
                  platforms['linux-aarch64'] = {
                      'url': f'https://github.com/{repo}/releases/download/v{version}/{rpi[0].name}',
                      'signature': sig.read_text().strip()
                  }

          mac = sorted(Path('artifacts/macos').glob('*.app.tar.gz')) if Path('artifacts/macos').exists() else []
          if mac:
              sig = Path(str(mac[0]) + '.sig')
              if sig.exists():
                  url = f'https://github.com/{repo}/releases/download/v{version}/{mac[0].name}'
                  signature = sig.read_text().strip()
                  platforms['darwin-x86_64'] = {'url': url, 'signature': signature}
                  platforms['darwin-aarch64'] = {'url': url, 'signature': signature}

          data = {
              'version': version,
              'notes': 'See the release notes on GitHub.',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms
          }
          Path('latest.json').write_text(json.dumps(data, indent=2))
          PYEOF

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t RELEASE_FILES < <(find artifacts -type f | sort)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "${RELEASE_FILES[@]}" \
            latest.json
